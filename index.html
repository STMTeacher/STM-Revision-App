<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Subject Revision App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            color: white;
            background-color: #ff0000; /* Red */
            cursor: pointer;
        }
        .button.yellow {
            background-color: #ffff00; /* Yellow */
            color: black;
        }
        .button.black {
            background-color: #000000; /* Black */
        }
        #quiz-area {
            margin-top: 20px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
        }
        .question {
            margin: 15px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #ff0000;
        }
    </style>
</head>
<body>
    <h1>Multi-Subject Revision App</h1>
    <div id="subject-buttons"></div>
    <button id="clear-cache" onclick="confirmClearCache()">Clear Cache</button>
    <div id="quiz-area"></div>

    <script>
        async function loadSubjects() {
            try {
                const response = await fetch('https://api.github.com/repos/STMTeacher/STM-Revision-App/contents');
                const data = await response.json();
                data.forEach(item => {
                    if (item.name.endsWith('.csv')) {
                        const button = document.createElement('button');
                        button.innerText = item.name.replace('.csv', '');
                        button.className = 'button';
                        button.onclick = () => loadCSV(item.download_url);
                        document.getElementById('subject-buttons').appendChild(button);
                    }
                });
            } catch (error) {
                console.error('Error loading subjects:', error);
                alert('Failed to load subjects. Check console for details.');
            }
        }

        async function loadCSV(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    alert('Failed to load CSV.');
                    return;
                }
                const text = await response.text();
                const questions = parseCSV(text);
                displayQuiz(questions);
            } catch (error) {
                console.error('Error loading CSV:', error);
                alert('Error loading CSV file.');
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const questions = [];
            lines.forEach(line => {
                if (line.trim()) {
                    questions.push(line);
                }
            });
            return questions;
        }

        function displayQuiz(questions) {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = '<h2>Quiz Questions</h2>';
            questions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `<strong>${index + 1}. ${question}</strong>`;
                quizArea.appendChild(questionDiv);
            });
        }

        function confirmClearCache() {
            if (confirm('Are you sure you want to clear the cache?')) {
                localStorage.clear();
                alert('Cache cleared!');
            }
        }

        window.onload = loadSubjects;
    </script>
</body>
</html>
