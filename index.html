<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revision App</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-1: #050505;
      --bg-2: #0d0d0d;
      --panel: rgba(255,255,255,0.08);
      --panel-strong: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.14);
      --text: #f4f7f2;
      --muted: #b7c0b4;
      --green-1: #32d74b;
      --green-2: #0cbf72;
      --yellow-1: #ffe66d;
      --yellow-2: #ffb703;
      --danger: #ff5f57;
      --ok: #30d158;
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(50,215,75,0.12), transparent 30%),
        radial-gradient(circle at top right, rgba(255,183,3,0.10), transparent 28%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-card,
    .tracker-card,
    .content-card,
    .topic-card,
    .stat-card,
    .question-card,
    .results-card,
    .revision-card {
      padding: 22px;
    }

    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: 2rem; letter-spacing: 0.2px; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.05rem; }
    .muted { color: var(--muted); }

    .button-row,
    .topic-grid,
    .subtopic-grid,
    .stats-grid,
    .results-grid,
    .revision-grid,
    .top-nav,
    .subject-grid,
    .badge-grid {
      display: grid;
      gap: 12px;
    }

    .button-row {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      margin-top: 18px;
    }

    .top-nav {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin-bottom: 18px;
    }

    .topic-grid,
    .subtopic-grid,
    .results-grid,
    .revision-grid,
    .subject-grid,
    .badge-grid {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-top: 16px;
    }

    .glass-btn,
    .nav-btn,
    .answer-btn,
    .ghost-btn,
    .chip-btn,
    .small-btn,
    .subject-btn {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      color: #101410;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.20);
    }

    .glass-btn,
    .nav-btn,
    .answer-btn,
    .chip-btn,
    .small-btn,
    .subject-btn {
      background: linear-gradient(135deg, var(--yellow-1), var(--green-1));
    }

    .glass-btn {
      padding: 16px 18px;
      min-height: 70px;
      font-size: 1rem;
      text-align: left;
    }

    .nav-btn,
    .ghost-btn,
    .small-btn,
    .subject-btn {
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .answer-btn {
      width: 100%;
      padding: 16px;
      text-align: left;
      font-size: 1rem;
      margin-top: 10px;
    }

    .ghost-btn {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .chip-btn {
      padding: 12px 14px;
      text-align: left;
      color: #0f140f;
    }

    .subject-btn.active {
      outline: 3px solid #30d158;
      transform: translateY(-2px);
    }

    .glass-btn:hover,
    .nav-btn:hover,
    .answer-btn:hover,
    .ghost-btn:hover,
    .chip-btn:hover,
    .small-btn:hover,
    .subject-btn:hover {
      transform: translateY(-2px);
    }

    .glass-btn:disabled,
    .nav-btn:disabled,
    .answer-btn:disabled,
    .ghost-btn:disabled,
    .chip-btn:disabled,
    .small-btn:disabled,
    .subject-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .kicker {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      color: var(--yellow-1);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 6px 0;
    }

    .progress-wrap {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 0;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--yellow-2), var(--green-1));
      width: 0%;
      transition: width 0.2s ease;
    }

    .question-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.86rem;
      color: var(--muted);
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 54px;
    }

    .ok { color: var(--ok); }
    .bad { color: var(--danger); }

    .table-like {
      display: grid;
      gap: 10px;
    }

    .row-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      padding: 14px;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 8px;
    }

    .mini {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .secure {
      color: var(--ok);
      font-weight: 700;
    }

    .needs-work {
      color: var(--yellow-1);
      font-weight: 700;
    }

    .danger-text {
      color: #ffb4ad;
      font-weight: 700;
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 18px;
      color: var(--muted);
      text-align: centre;
    }

    .rendered-html sup {
      font-size: 0.75em;
      vertical-align: super;
      line-height: 0;
    }

    .rendered-html sub {
      font-size: 0.75em;
      vertical-align: sub;
      line-height: 0;
    }

    .badge-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      padding: 14px;
    }

    .badge-earned {
      border-color: rgba(48, 209, 88, 0.55);
      box-shadow: inset 0 0 0 1px rgba(48, 209, 88, 0.2);
    }

    .badge-title {
      font-weight: 800;
      margin-bottom: 6px;
    }

    @media (max-width: 960px) {
      .hero { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-nav" id="topNav"></div>
    <div id="app"></div>
  </div>

  <script>
    const CSV_FILE = "questions.csv";
    const STORAGE_KEY = "revisionAppProgress_v2";

    const XP_CORRECT = 10;
    const XP_SECURE_BONUS = 15;

    const BADGE_DEFS = [
      { key: "first_correct", title: "First Success", desc: "Answer your first question correctly." },
      { key: "ten_correct", title: "10 Correct", desc: "Answer 10 questions correctly." },
      { key: "twenty_five_correct", title: "25 Correct", desc: "Answer 25 questions correctly." },
      { key: "fifty_correct", title: "50 Correct", desc: "Answer 50 questions correctly." },
      { key: "hundred_xp", title: "100 XP", desc: "Earn 100 XP." },
      { key: "two_fifty_xp", title: "250 XP", desc: "Earn 250 XP." },
      { key: "five_hundred_xp", title: "500 XP", desc: "Earn 500 XP." },
      { key: "ten_secure", title: "10 Secure", desc: "Make 10 questions secure." }
    ];

    const state = {
      allQuestions: [],
      activeQuestions: [],
      subjects: [],
      topics: [],
      subtopics: [],
      selectedSubject: null,
      view: "loading",
      currentQuestions: [],
      currentIndex: 0,
      currentMode: null,
      selectedTopic: null,
      selectedSubtopic: null,
      timedMode: false,
      timerSeconds: 0,
      timerHandle: null,
      questionLocked: false,
      sessionScore: 0,
      sessionCorrect: 0,
      sessionWrong: 0,
      timedOut: false,
      progress: loadProgress(),
      lastDiagnosticSummary: null
    };

    function defaultProgress() {
      return {
        perQuestion: {},
        revisionList: {},
        meta: {
          xp: 0,
          totalCorrect: 0,
          totalWrong: 0,
          badges: [],
          secureCountAwardedKeys: []
        }
      };
    }

    function loadProgress() {
      try {
        const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return {
          ...defaultProgress(),
          ...(loaded || {}),
          perQuestion: { ...(loaded?.perQuestion || {}) },
          revisionList: { ...(loaded?.revisionList || {}) },
          meta: {
            ...defaultProgress().meta,
            ...(loaded?.meta || {})
          }
        };
      } catch {
        return defaultProgress();
      }
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    }

    function normaliseQuestion(raw, fallbackId) {
      const q = { ...raw };
      q.ID = String(q.ID || fallbackId).trim();
      q.Subject = String(q.Subject || "General").trim();
      q.Topic = String(q.Topic || "General").trim();
      q.Subtopic = String(q.Subtopic || "").trim();
      q.Question = String(q.Question || "").trim();
      q["Option A"] = String(q["Option A"] || "").trim();
      q["Option B"] = String(q["Option B"] || "").trim();
      q["Option C"] = String(q["Option C"] || "").trim();
      q["Option D"] = String(q["Option D"] || "").trim();
      q["Correct Letter"] = String(q["Correct Letter"] || "").trim().toUpperCase();
      q["Correct Index"] = Number(q["Correct Index"] ?? letterToIndex(q["Correct Letter"]));
      q.Active = String(q.Active || "Yes").trim();
      q.Explanation = String(q.Explanation || q.Notes || "").trim();
      q.Notes = String(q.Notes || "").trim();
      q.__key = buildQuestionKey(q);
      return q;
    }

    function buildQuestionKey(q) {
      return `${q.Subject}__${q.ID}__${q.Topic}__${q.Question}`;
    }

    function letterToIndex(letter) {
      return ({ A: 0, B: 1, C: 2, D: 3 })[letter] ?? 0;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getSelectedSubjectQuestions() {
      if (!state.selectedSubject) return [];
      return state.allQuestions.filter(q => q.Subject === state.selectedSubject);
    }

    function refreshActiveQuestions() {
      state.activeQuestions = getSelectedSubjectQuestions();
      state.topics = [...new Set(state.activeQuestions.map(q => q.Topic).filter(Boolean))].sort();
      state.subtopics = [...new Set(state.activeQuestions.map(q => q.Subtopic).filter(Boolean))].sort();
    }

    function selectSubject(subject) {
      state.selectedSubject = subject;
      refreshActiveQuestions();
      state.selectedTopic = null;
      state.selectedSubtopic = null;
      if (state.view !== "loading" && state.view !== "error") {
        state.view = "home";
      }
      render();
    }

    function getQuestionProgress(q) {
      return state.progress.perQuestion[q.__key] || {
        correctCount: 0,
        wrongCount: 0,
        lastResult: null,
        subject: q.Subject,
        topic: q.Topic,
        subtopic: q.Subtopic || "",
        question: q.Question
      };
    }

    function isSecure(q) {
      return getQuestionProgress(q).correctCount >= 3;
    }

    function addToRevision(q) {
      state.progress.revisionList[q.__key] = {
        id: q.ID,
        subject: q.Subject,
        topic: q.Topic,
        subtopic: q.Subtopic || "",
        question: q.Question
      };
    }

    function removeFromRevisionIfSecure(q) {
      if (isSecure(q)) {
        delete state.progress.revisionList[q.__key];
      }
    }

    function awardBadge(key) {
      if (!state.progress.meta.badges.includes(key)) {
        state.progress.meta.badges.push(key);
      }
    }

    function evaluateBadges() {
      const meta = state.progress.meta;
      const secureCount = state.allQuestions.filter(isSecure).length;

      if (meta.totalCorrect >= 1) awardBadge("first_correct");
      if (meta.totalCorrect >= 10) awardBadge("ten_correct");
      if (meta.totalCorrect >= 25) awardBadge("twenty_five_correct");
      if (meta.totalCorrect >= 50) awardBadge("fifty_correct");

      if (meta.xp >= 100) awardBadge("hundred_xp");
      if (meta.xp >= 250) awardBadge("two_fifty_xp");
      if (meta.xp >= 500) awardBadge("five_hundred_xp");

      if (secureCount >= 10) awardBadge("ten_secure");
    }

    function updateQuestionStats(q, wasCorrect) {
      const before = getQuestionProgress(q);
      const wasSecureBefore = before.correctCount >= 3;

      const next = {
        ...before,
        correctCount: before.correctCount + (wasCorrect ? 1 : 0),
        wrongCount: before.wrongCount + (wasCorrect ? 0 : 1),
        lastResult: wasCorrect ? "correct" : "wrong",
        subject: q.Subject,
        topic: q.Topic,
        subtopic: q.Subtopic || "",
        question: q.Question
      };

      state.progress.perQuestion[q.__key] = next;

      if (wasCorrect) {
        state.progress.meta.xp += XP_CORRECT;
        state.progress.meta.totalCorrect += 1;
      } else {
        state.progress.meta.totalWrong += 1;
      }

      const isSecureNow = next.correctCount >= 3;

      if (wasCorrect && !wasSecureBefore && isSecureNow) {
        state.progress.meta.xp += XP_SECURE_BONUS;
      }

      if (wasCorrect) {
        removeFromRevisionIfSecure(q);
      } else {
        addToRevision(q);
      }

      evaluateBadges();
      saveProgress();
    }

    function topicSummary() {
      const topics = [...new Set(state.activeQuestions.map(q => q.Topic))].sort();
      return topics.map(topic => {
        const topicQs = state.activeQuestions.filter(q => q.Topic === topic);
        const secureCount = topicQs.filter(isSecure).length;
        const revisionCount = topicQs.filter(q => state.progress.revisionList[q.__key]).length;
        const attempted = topicQs.filter(q => {
          const p = getQuestionProgress(q);
          return p.correctCount > 0 || p.wrongCount > 0;
        }).length;

        return {
          topic,
          total: topicQs.length,
          secureCount,
          revisionCount,
          attempted,
          securePct: topicQs.length ? Math.round((secureCount / topicQs.length) * 100) : 0
        };
      });
    }

    function overallStats() {
      const total = state.activeQuestions.length;
      const secure = state.activeQuestions.filter(isSecure).length;
      const revision = state.activeQuestions.filter(q => state.progress.revisionList[q.__key]).length;
      const attempted = state.activeQuestions.filter(q => {
        const p = getQuestionProgress(q);
        return p.correctCount > 0 || p.wrongCount > 0;
      }).length;

      return {
        total,
        secure,
        revision,
        attempted,
        xp: state.progress.meta.xp,
        badges: state.progress.meta.badges.length
      };
    }

    function parseCSV() {
      state.view = "loading";
      render();

      Papa.parse(CSV_FILE, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const cleaned = results.data
            .map((row, i) => normaliseQuestion(row, i + 1))
            .filter(q => q.Question && String(q.Active).toLowerCase() !== "no");

          state.allQuestions = cleaned;
          state.subjects = [...new Set(cleaned.map(q => q.Subject).filter(Boolean))].sort();

          if (!state.selectedSubject && state.subjects.length) {
            state.selectedSubject = state.subjects[0];
          }

          refreshActiveQuestions();
          state.view = "home";
          render();
        },
        error: () => {
          state.view = "error";
          render();
        }
      });
    }

    function setView(view) {
      stopTimer();
      state.view = view;
      state.questionLocked = false;
      render();
    }

    function ensureSubjectSelected() {
      if (!state.selectedSubject) {
        alert("Please select a subject first.");
        return false;
      }
      if (!state.activeQuestions.length) {
        alert("There are no questions available for the selected subject.");
        return false;
      }
      return true;
    }

    function startDiagnostic() {
      if (!ensureSubjectSelected()) return;

      const count = Math.min(20, state.activeQuestions.length);
      state.currentMode = "diagnostic";
      state.selectedTopic = null;
      state.selectedSubtopic = null;
      state.timedMode = false;
      state.timedOut = false;
      state.currentQuestions = shuffle(state.activeQuestions).slice(0, count);
      state.currentIndex = 0;
      state.sessionScore = 0;
      state.sessionCorrect = 0;
      state.sessionWrong = 0;
      state.questionLocked = false;
      state.view = "quiz";
      render();
    }

    function openPracticeTopics() {
      if (!ensureSubjectSelected()) return;
      state.view = "practiceTopics";
      render();
    }

    function openResults() {
      if (!ensureSubjectSelected()) return;
      state.view = "results";
      render();
    }

    function openRevisionList() {
      if (!ensureSubjectSelected()) return;
      state.view = "revision";
      render();
    }

    function startPractice(topic, subtopic = null, timed = false) {
      let filtered = state.activeQuestions.filter(q => q.Topic === topic);
      if (subtopic) filtered = filtered.filter(q => q.Subtopic === subtopic);
      if (!filtered.length) return;

      state.currentMode = timed ? "timedPractice" : "practice";
      state.selectedTopic = topic;
      state.selectedSubtopic = subtopic;
      state.timedMode = timed;
      state.timedOut = false;
      state.currentQuestions = buildPracticeSet(filtered, timed ? 20 : filtered.length);
      state.currentIndex = 0;
      state.sessionScore = 0;
      state.sessionCorrect = 0;
      state.sessionWrong = 0;
      state.questionLocked = false;
      state.view = "quiz";

      if (timed) startTimer(60);
      render();
    }

    function buildPracticeSet(filtered, count) {
      const insecure = filtered.filter(q => !isSecure(q));
      const secure = filtered.filter(q => isSecure(q));
      const ordered = [...shuffle(insecure), ...shuffle(secure)];
      return ordered.slice(0, Math.min(count, ordered.length));
    }

    function startRevisionMode() {
      if (!ensureSubjectSelected()) return;

      const keys = Object.keys(state.progress.revisionList);
      const revisionQs = state.activeQuestions.filter(q => keys.includes(q.__key));

      if (!revisionQs.length) {
        alert("Your revision list is empty for this subject.");
        return;
      }

      state.currentMode = "revision";
      state.selectedTopic = null;
      state.selectedSubtopic = null;
      state.timedMode = false;
      state.timedOut = false;
      state.currentQuestions = shuffle(revisionQs);
      state.currentIndex = 0;
      state.sessionScore = 0;
      state.sessionCorrect = 0;
      state.sessionWrong = 0;
      state.questionLocked = false;
      state.view = "quiz";
      render();
    }

    function startTimer(seconds) {
      stopTimer();
      state.timerSeconds = seconds;

      state.timerHandle = setInterval(() => {
        state.timerSeconds -= 1;

        if (state.timerSeconds <= 0) {
          stopTimer();
          finishSession(true);
          return;
        }

        updateQuestionHeaderOnly();
      }, 1000);
    }

    function stopTimer() {
      if (state.timerHandle) clearInterval(state.timerHandle);
      state.timerHandle = null;
      state.timerSeconds = 0;
    }

    function updateQuestionHeaderOnly() {
      const el = document.getElementById("timerPill");
      if (el) el.textContent = `Time: ${state.timerSeconds}s`;
    }

    function answerQuestion(letter) {
      if (state.questionLocked) return;

      const q = state.currentQuestions[state.currentIndex];
      const correct = q["Correct Letter"] === letter;
      const before = getQuestionProgress(q);
      const wasSecureBefore = before.correctCount >= 3;

      state.questionLocked = true;
      state.sessionScore += correct ? 1 : 0;
      state.sessionCorrect += correct ? 1 : 0;
      state.sessionWrong += correct ? 0 : 1;

      updateQuestionStats(q, correct);

      const after = getQuestionProgress(q);
      const isSecureNow = after.correctCount >= 3;
      const justSecured = correct && !wasSecureBefore && isSecureNow;

      const feedback = document.getElementById("feedback");
      if (feedback) {
        const correctText = q[`Option ${q["Correct Letter"]}`];
        let extra = correct ? ` You earned <strong>${XP_CORRECT} XP</strong>.` : "";

        if (justSecured) {
          extra += ` This question is now secure. Bonus: <strong>+${XP_SECURE_BONUS} XP</strong>.`;
        }

        feedback.innerHTML = correct
          ? `<span class="ok"><strong>Correct.</strong></span> Secure count for this question: ${after.correctCount}/3.${extra}`
          : `<span class="bad"><strong>Not correct.</strong></span> Correct answer: <strong>${q["Correct Letter"]}</strong> – ${correctText}. This question has been added to your revision list.`;
      }

      highlightButtons(letter, q["Correct Letter"]);
    }

    function highlightButtons(chosen, correct) {
      document.querySelectorAll(".answer-btn").forEach(btn => {
        const letter = btn.dataset.letter;

        if (letter === correct) {
          btn.style.outline = "3px solid #30d158";
        }

        if (letter === chosen && chosen !== correct) {
          btn.style.outline = "3px solid #ff5f57";
        }

        btn.disabled = true;
      });

      const nextWrap = document.getElementById("nextWrap");
      if (nextWrap) nextWrap.style.display = "block";
    }

    function nextQuestion() {
      state.questionLocked = false;
      state.currentIndex += 1;

      if (state.currentIndex >= state.currentQuestions.length) {
        finishSession(false);
        return;
      }

      render();
    }

    function finishSession(timedOut) {
      stopTimer();

      if (state.currentMode === "diagnostic") {
        const summary = buildDiagnosticSummary();
        state.lastDiagnosticSummary = summary;
        state.view = "diagnosticComplete";
        render();
        return;
      }

      state.view = "sessionComplete";
      state.timedOut = timedOut;
      render();
    }

    function buildDiagnosticSummary() {
      const askedTopics = [...new Set(state.currentQuestions.map(q => q.Topic))];

      return askedTopics.map(topic => {
        const questions = state.currentQuestions.filter(q => q.Topic === topic);
        const correct = questions.filter(q => getQuestionProgress(q).lastResult === "correct").length;

        return {
          topic,
          asked: questions.length,
          correct,
          incorrect: questions.length - correct,
          pct: questions.length ? Math.round((correct / questions.length) * 100) : 0
        };
      }).sort((a, b) => a.pct - b.pct);
    }

    function renderTopNav() {
      const nav = document.getElementById("topNav");
      if (!nav) return;

      if (state.view === "loading" || state.view === "error") {
        nav.innerHTML = "";
        return;
      }

      nav.innerHTML = `
        <button class="nav-btn" onclick="goHome()">Home</button>
        <button class="nav-btn" onclick="startDiagnostic()" ${state.selectedSubject ? "" : "disabled"}>Diagnostic</button>
        <button class="nav-btn" onclick="openPracticeTopics()" ${state.selectedSubject ? "" : "disabled"}>Practise</button>
        <button class="nav-btn" onclick="openResults()" ${state.selectedSubject ? "" : "disabled"}>Results</button>
        <button class="nav-btn" onclick="openRevisionList()" ${state.selectedSubject ? "" : "disabled"}>Revision List</button>
      `;
    }

    function goHome() {
      stopTimer();
      state.view = "home";
      render();
    }

    function renderHtmlTargets(targets) {
      setTimeout(() => {
        targets.forEach(target => {
          const el = document.getElementById(target.id);
          if (el) el.innerHTML = target.html;
        });
      }, 0);
    }

    function renderRevisionHtml(questions) {
      setTimeout(() => {
        document.querySelectorAll(".rev-question").forEach(el => {
          const i = Number(el.getAttribute("data-index"));
          if (!Number.isNaN(i) && questions[i]) {
            el.innerHTML = questions[i].Question;
          }
        });
      }, 0);
    }

    function escapeJs(text) {
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "")
        .replace(/\n/g, "\\n");
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderBadgeCards() {
      const earned = state.progress.meta.badges;
      return BADGE_DEFS.map(badge => `
        <div class="badge-card ${earned.includes(badge.key) ? "badge-earned" : ""}">
          <div class="badge-title">${escapeHtml(badge.title)}</div>
          <div class="mini">${escapeHtml(badge.desc)}</div>
          <div class="mini" style="margin-top:8px;">${earned.includes(badge.key) ? "Earned" : "Locked"}</div>
        </div>
      `).join("");
    }

    function render() {
      renderTopNav();

      const app = document.getElementById("app");
      if (!app) return;

      if (state.view === "loading") {
        app.innerHTML = `<div class="panel content-card"><h2>Loading questions…</h2><p class="muted">Reading from <strong>${CSV_FILE}</strong>. Any changes to your CSV will update the subject, topic and subtopic lists automatically.</p></div>`;
        return;
      }

      if (state.view === "error") {
        app.innerHTML = `
          <div class="panel content-card">
            <h2>Could not read the CSV file</h2>
            <p class="muted">Check that <strong>${CSV_FILE}</strong> is in the same folder as <strong>index.html</strong>, and that the column headers match your template.</p>
            <p class="muted">For this version, your CSV should ideally include: <strong>ID, Subject, Topic, Subtopic, Question, Option A, Option B, Option C, Option D, Correct Letter, Explanation, Active</strong>.</p>
          </div>
        `;
        return;
      }

      if (state.view === "home") {
        renderHome(app);
        return;
      }

      if (state.view === "practiceTopics") {
        renderPracticeTopics(app);
        return;
      }

      if (state.view === "quiz") {
        renderQuiz(app);
        return;
      }

      if (state.view === "results") {
        renderResults(app);
        return;
      }

      if (state.view === "revision") {
        renderRevision(app);
        return;
      }

      if (state.view === "diagnosticComplete") {
        renderDiagnosticComplete(app);
        return;
      }

      if (state.view === "sessionComplete") {
        renderSessionComplete(app);
        return;
      }
    }

    function renderHome(app) {
      const stats = overallStats();
      const summary = topicSummary().slice(0, 6);

      app.innerHTML = `
        <div class="hero">
          <div class="panel hero-card">
            <div class="kicker">Revision App</div>
            <h1>Choose a subject, then answer 20 questions to start the diagnosis of what you do and do not know.</h1>
            <p class="muted">The app now works by subject. Subjects, topics and subtopics are pulled directly from the CSV file, so if you update the CSV later the app will update automatically.</p>

            <h3>Select a subject</h3>
            <div class="subject-grid" style="margin-bottom:12px;">
              ${state.subjects.length ? state.subjects.map(subject => `
                <button class="subject-btn ${state.selectedSubject === subject ? "active" : ""}" onclick="selectSubject('${escapeJs(subject)}')">
                  ${escapeHtml(subject)}
                </button>
              `).join("") : `<div class="empty-state">No subjects found in the CSV.</div>`}
            </div>

            <p class="mini">Current subject: <strong>${state.selectedSubject ? escapeHtml(state.selectedSubject) : "None selected"}</strong></p>

            <div class="button-row">
              <button class="glass-btn" onclick="startDiagnostic()" ${state.selectedSubject ? "" : "disabled"}>Start Diagnostic<br><span class="mini">20 mixed questions from the selected subject</span></button>
              <button class="glass-btn" onclick="openPracticeTopics()" ${state.selectedSubject ? "" : "disabled"}>Practise<br><span class="mini">Choose a topic from the selected subject</span></button>
              <button class="glass-btn" onclick="openResults()" ${state.selectedSubject ? "" : "disabled"}>Results<br><span class="mini">See strengths and gaps</span></button>
              <button class="glass-btn" onclick="startRevisionMode()" ${state.selectedSubject ? "" : "disabled"}>Revision List<br><span class="mini">Questions answered incorrectly</span></button>
            </div>

            <div class="stats-grid">
              <div class="stat-card"><div class="mini">Questions in subject</div><div class="stat-value">${stats.total}</div></div>
              <div class="stat-card"><div class="mini">Attempted</div><div class="stat-value">${stats.attempted}</div></div>
              <div class="stat-card"><div class="mini">Secure (3+ correct)</div><div class="stat-value">${stats.secure}</div></div>
              <div class="stat-card"><div class="mini">Revision list</div><div class="stat-value">${stats.revision}</div></div>
              <div class="stat-card"><div class="mini">XP</div><div class="stat-value">${stats.xp}</div></div>
              <div class="stat-card"><div class="mini">Badges</div><div class="stat-value">${stats.badges}</div></div>
            </div>
          </div>

          <div class="panel tracker-card">
            <h2>Tracking sheet</h2>
            ${state.selectedSubject ? `<p class="mini" style="margin-bottom:14px;">Subject: <strong>${escapeHtml(state.selectedSubject)}</strong></p>` : ""}
            ${summary.length ? summary.map(item => `
              <div class="row-card" style="margin-bottom:10px;">
                <div class="row-top">
                  <strong>${escapeHtml(item.topic)}</strong>
                  <span class="mini">${item.secureCount}/${item.total} secure</span>
                </div>
                <div class="progress-wrap"><div class="progress-bar" style="width:${item.securePct}%;"></div></div>
                <div class="mini" style="margin-top:8px;">Needs work: ${item.revisionCount} | Attempted: ${item.attempted}</div>
              </div>
            `).join("") : `<div class="empty-state">Select a subject and start a diagnostic to begin tracking.</div>`}
          </div>
        </div>

        <div class="panel content-card">
          <div class="row-top">
            <div>
              <h2>XP and badges</h2>
              <p class="muted">Earn XP for correct answers and bonus XP when a question becomes secure.</p>
            </div>
            <div class="pill">Total XP: ${state.progress.meta.xp}</div>
          </div>
          <div class="badge-grid">
            ${renderBadgeCards()}
          </div>
        </div>
      `;
    }

    function renderPracticeTopics(app) {
      const topics = topicSummary();

      app.innerHTML = `
        <div class="panel content-card">
          <h2>Practise by topic</h2>
          <p class="muted">Subject: <strong>${escapeHtml(state.selectedSubject || "")}</strong>. Only topics found in the CSV file for this subject are shown here.</p>
          <div class="topic-grid">
            ${topics.length ? topics.map(item => {
              const subs = [...new Set(state.activeQuestions.filter(q => q.Topic === item.topic && q.Subtopic).map(q => q.Subtopic))].sort();
              return `
                <div class="panel topic-card">
                  <h3>${escapeHtml(item.topic)}</h3>
                  <p class="mini">${item.total} questions | ${item.secureCount} secure | ${item.revisionCount} in revision</p>
                  <div class="progress-wrap"><div class="progress-bar" style="width:${item.securePct}%;"></div></div>
                  <div class="button-row" style="margin-top:14px;">
                    <button class="small-btn" onclick="startPractice('${escapeJs(item.topic)}', null, false)">Practise topic</button>
                    <button class="small-btn" onclick="startPractice('${escapeJs(item.topic)}', null, true)">Timed practice</button>
                  </div>
                  ${subs.length ? `
                    <div style="margin-top:14px;">
                      <div class="mini" style="margin-bottom:8px;">Subtopics</div>
                      <div class="subtopic-grid">
                        ${subs.map(sub => `<button class="chip-btn" onclick="startPractice('${escapeJs(item.topic)}','${escapeJs(sub)}',false)">${escapeHtml(sub)}</button>`).join("")}
                      </div>
                    </div>
                  ` : ""}
                </div>
              `;
            }).join("") : `<div class="empty-state">No topics found for this subject.</div>`}
          </div>
        </div>
      `;
    }

    function renderQuiz(app) {
      const q = state.currentQuestions[state.currentIndex];
      const total = state.currentQuestions.length;
      const qProgress = getQuestionProgress(q);

      app.innerHTML = `
        <div class="panel question-card">
          <div class="row-top">
            <div>
              <div class="kicker">${state.currentMode === "diagnostic" ? "Diagnostic" : state.currentMode === "timedPractice" ? "Timed Practice" : state.currentMode === "revision" ? "Revision" : "Practise"}</div>
              <h2>Question ${state.currentIndex + 1} of ${total}</h2>
            </div>
            <div class="question-meta">
              <span class="pill">Subject: ${escapeHtml(q.Subject)}</span>
              <span class="pill">Topic: ${escapeHtml(q.Topic)}</span>
              ${q.Subtopic ? `<span class="pill">Subtopic: ${escapeHtml(q.Subtopic)}</span>` : ""}
              ${state.timedMode ? `<span class="pill" id="timerPill">Time: ${state.timerSeconds}s</span>` : ""}
              <span class="pill">Secure count: ${qProgress.correctCount}/3</span>
              <span class="pill">XP: ${state.progress.meta.xp}</span>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar" style="width:${Math.round((state.currentIndex / total) * 100)}%;"></div>
          </div>
          <div style="margin-top:18px;">
            <h3 id="questionText" class="rendered-html"></h3>

            <button class="answer-btn" data-letter="A" onclick="answerQuestion('A')">
              A. <span id="optA" class="rendered-html"></span>
            </button>

            <button class="answer-btn" data-letter="B" onclick="answerQuestion('B')">
              B. <span id="optB" class="rendered-html"></span>
            </button>

            <button class="answer-btn" data-letter="C" onclick="answerQuestion('C')">
              C. <span id="optC" class="rendered-html"></span>
            </button>

            <button class="answer-btn" data-letter="D" onclick="answerQuestion('D')">
              D. <span id="optD" class="rendered-html"></span>
            </button>

            <div class="feedback rendered-html" id="feedback">Choose one answer.</div>

            <div id="nextWrap" style="display:none; margin-top:14px;">
              <button class="small-btn" onclick="nextQuestion()">Next question</button>
            </div>
          </div>
        </div>
      `;

      renderHtmlTargets([
        { id: "questionText", html: q.Question },
        { id: "optA", html: q["Option A"] },
        { id: "optB", html: q["Option B"] },
        { id: "optC", html: q["Option C"] },
        { id: "optD", html: q["Option D"] }
      ]);
    }

    function renderResults(app) {
      const topics = topicSummary();
      const weakest = [...topics].sort((a, b) => a.securePct - b.securePct).slice(0, 6);

      app.innerHTML = `
        <div class="panel results-card">
          <h2>Results</h2>
          <p class="muted">Subject: <strong>${escapeHtml(state.selectedSubject || "")}</strong>. A question counts as secure when it has been answered correctly at least <strong>three times</strong>.</p>
          <div class="results-grid">
            ${topics.length ? topics.map(item => `
              <div class="row-card">
                <div class="row-top">
                  <strong>${escapeHtml(item.topic)}</strong>
                  <span class="${item.securePct >= 70 ? "secure" : item.securePct >= 40 ? "needs-work" : "danger-text"}">${item.securePct}% secure</span>
                </div>
                <div class="mini">Attempted: ${item.attempted}/${item.total}</div>
                <div class="mini">Secure: ${item.secureCount} | Revision: ${item.revisionCount}</div>
                <div class="progress-wrap"><div class="progress-bar" style="width:${item.securePct}%;"></div></div>
                <div class="button-row" style="margin-top:12px;">
                  <button class="small-btn" onclick="startPractice('${escapeJs(item.topic)}', null, false)">Practise topic</button>
                  <button class="ghost-btn" onclick="startPractice('${escapeJs(item.topic)}', null, true)">Timed practice</button>
                </div>
              </div>
            `).join("") : `<div class="empty-state">No results yet for this subject.</div>`}
          </div>
          <div style="margin-top:22px;">
            <h3>Priority topics to practise</h3>
            ${weakest.length ? weakest.map(item => `<div class="mini" style="margin-bottom:8px;"><strong>${escapeHtml(item.topic)}</strong> — ${item.securePct}% secure, ${item.revisionCount} on revision list.</div>`).join("") : `<div class="mini">No diagnostic data yet.</div>`}
          </div>
        </div>
      `;
    }

    function renderRevision(app) {
      const keys = Object.keys(state.progress.revisionList);
      const questions = state.activeQuestions.filter(q => keys.includes(q.__key));

      app.innerHTML = `
        <div class="panel revision-card">
          <div class="row-top">
            <div>
              <h2>Revision list</h2>
              <p class="muted">Subject: <strong>${escapeHtml(state.selectedSubject || "")}</strong>. Any question answered incorrectly appears here until it becomes secure.</p>
            </div>
            <button class="small-btn" onclick="startRevisionMode()" ${questions.length ? "" : "disabled"}>Practise revision list</button>
          </div>
          <div class="revision-grid">
            ${questions.length ? questions.map((q, i) => {
              const p = getQuestionProgress(q);
              return `
                <div class="row-card">
                  <div class="mini">${escapeHtml(q.Topic)}${q.Subtopic ? ` • ${escapeHtml(q.Subtopic)}` : ""}</div>
                  <strong class="rev-question rendered-html" data-index="${i}"></strong>
                  <div class="mini" style="margin-top:8px;">Correct count: ${p.correctCount}/3 | Wrong: ${p.wrongCount}</div>
                </div>
              `;
            }).join("") : `<div class="empty-state">Nothing in the revision list for this subject.</div>`}
          </div>
        </div>
      `;

      renderRevisionHtml(questions);
    }

    function renderDiagnosticComplete(app) {
      const summary = state.lastDiagnosticSummary || [];

      app.innerHTML = `
        <div class="panel results-card">
          <h2>Diagnostic complete</h2>
          <p class="muted">Subject: <strong>${escapeHtml(state.selectedSubject || "")}</strong>. Here is a first diagnosis of what to practise next.</p>
          <div class="stats-grid">
            <div class="stat-card"><div class="mini">Correct</div><div class="stat-value">${state.sessionCorrect}</div></div>
            <div class="stat-card"><div class="mini">Incorrect</div><div class="stat-value">${state.sessionWrong}</div></div>
            <div class="stat-card"><div class="mini">Score</div><div class="stat-value">${state.sessionScore}/${state.currentQuestions.length}</div></div>
            <div class="stat-card"><div class="mini">Total XP</div><div class="stat-value">${state.progress.meta.xp}</div></div>
          </div>
          <div style="margin-top:20px;" class="table-like">
            ${summary.length ? summary.map(item => `
              <div class="row-card">
                <div class="row-top">
                  <strong>${escapeHtml(item.topic)}</strong>
                  <span class="${item.pct >= 70 ? "secure" : item.pct >= 40 ? "needs-work" : "danger-text"}">${item.pct}%</span>
                </div>
                <div class="mini">Asked: ${item.asked} | Correct: ${item.correct} | Incorrect: ${item.incorrect}</div>
                <div class="button-row" style="margin-top:12px;">
                  <button class="small-btn" onclick="startPractice('${escapeJs(item.topic)}', null, false)">Practise this topic</button>
                  <button class="ghost-btn" onclick="startPractice('${escapeJs(item.topic)}', null, true)">Timed practice</button>
                </div>
              </div>
            `).join("") : `<div class="empty-state">No summary available.</div>`}
          </div>
        </div>
      `;
    }

    function renderSessionComplete(app) {
      app.innerHTML = `
        <div class="panel results-card">
          <h2>${state.timedOut ? "Time complete" : "Session complete"}</h2>
          <div class="stats-grid">
            <div class="stat-card"><div class="mini">Correct</div><div class="stat-value">${state.sessionCorrect}</div></div>
            <div class="stat-card"><div class="mini">Incorrect</div><div class="stat-value">${state.sessionWrong}</div></div>
            <div class="stat-card"><div class="mini">Score</div><div class="stat-value">${state.sessionScore}/${state.currentQuestions.length}</div></div>
            <div class="stat-card"><div class="mini">Total XP</div><div class="stat-value">${state.progress.meta.xp}</div></div>
          </div>
          <div class="button-row" style="margin-top:18px;">
            <button class="glass-btn" onclick="openPracticeTopics()">Back to Practise</button>
            <button class="glass-btn" onclick="openResults()">View Results</button>
            <button class="glass-btn" onclick="openRevisionList()">Open Revision List</button>
          </div>
        </div>
      `;
    }

    parseCSV();
  </script>
</body>
</html>
